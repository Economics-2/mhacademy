<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">

<title>পরীক্ষা অ্যাডমিন | MH একাডেমি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d3b66;--navy2:#092a49;--gold:#c98a2c;--gold2:#f2c265;--bg:#f4f1ea;--card:#fff;--ink:#1f2a33;--muted:#7a7468;--line:#e3ddcf;--ok:#2e7d32;--bad:#c62828;}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
header.top{background:var(--navy2);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header.top b{font-size:16px}
header.top small{opacity:.75;display:block;font-size:11.5px}
header.top .sp{flex:1}
#saved{font-size:12px;color:var(--gold2)}
header.top a{color:#fff;font-size:12.5px;border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:4px 12px;text-decoration:none}
nav#tabs{background:var(--navy);display:flex;overflow-x:auto;position:sticky;top:50px;z-index:19;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:0 0 auto;background:none;border:none;color:#cfd8e3;padding:12px 15px;font:inherit;font-size:13.5px;font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav#tabs button.on{color:#fff;border-bottom-color:var(--gold2);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 6px rgba(9,42,73,.08);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px;color:var(--navy)}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--navy)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1}

input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,138,44,.45);border-color:var(--gold)}

.pubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}
.pubgrid label{display:flex;gap:8px;align-items:flex-start;background:#f8f5ee;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}

@media(max-width:600px){main{padding:10px}.fld{min-width:120px}}

<script>
(function () {
'use strict';

/* =========================================================
   Constants
   ========================================================= */
var KEY = 'mh_exam_admin_v1';
var CLASSES = [
  { id: 6, n: '৬ষ্ঠ শ্রেণি' }, { id: 7, n: '৭ম শ্রেণি' }, { id: 8, n: '৮ম শ্রেণি' },
  { id: 9, n: '৯ম শ্রেণি' }, { id: 10, n: '১০ম শ্রেণি' }, { id: 11, n: 'একাদশ শ্রেণি' }, { id: 12, n: 'দ্বাদশ শ্রেণি' }
];
var TYPES = ['অর্ধবার্ষিক পরীক্ষা', 'বার্ষিক পরীক্ষা', 'প্রাক-নির্বাচনী পরীক্ষা', 'নির্বাচনী পরীক্ষা', 'অন্যান্য পরীক্ষা'];
var GROUPS = ['', 'বিজ্ঞান', 'মানবিক', 'ব্যবসায় শিক্ষা'];
var SCALE = [
  { min: 80, g: 'A+', p: 5 }, { min: 70, g: 'A', p: 4 }, { min: 60, g: 'A-', p: 3.5 },
  { min: 50, g: 'B', p: 3 }, { min: 40, g: 'C', p: 2 }, { min: 33, g: 'D', p: 1 }, { min: 0, g: 'F', p: 0 }
];
var SUBJECT_SETS = {
  junior: ['বাংলা', 'ইংরেজি', 'গণিত', 'বিজ্ঞান', 'বাংলাদেশ ও বিশ্বপরিচয়', 'ধর্ম ও নৈতিক শিক্ষা', 'তথ্য ও যোগাযোগ প্রযুক্তি'],
  secondary: ['বাংলা', 'ইংরেজি', 'গণিত', 'পদার্থবিজ্ঞান', 'রসায়ন', 'জীববিজ্ঞান', 'উচ্চতর গণিত', 'তথ্য ও যোগাযোগ প্রযুক্তি'],
  higher: ['বাংলা', 'ইংরেজি', 'তথ্য ও যোগাযোগ প্রযুক্তি', 'পদার্থবিজ্ঞান', 'রসায়ন', 'গণিত']
};
var DEFAULT_INSTR = '১. পরীক্ষা শুরুর অন্তত ৩০ মিনিট আগে কেন্দ্রে উপস্থিত থাকতে হবে।\n২. প্রবেশপত্র ও পরিচয়পত্র সঙ্গে আনতে হবে।\n৩. মোবাইল ফোন ও অন্যান্য ইলেকট্রনিক ডিভাইস আনা নিষিদ্ধ।\n৪. পরীক্ষার হলে কোনো ধরনের অসদুপায় অবলম্বন করা যাবে না।';
var TABS = [
  ['exams', '১. পরীক্ষা'], ['students', '২. শিক্ষার্থী'], ['notices', '৩. নোটিশ'], ['routine', '৪. রুটিন'],
  ['seats', '৫. সিট প্ল্যান'], ['marks', '৬. নম্বর ইনপুট'], ['publish', '৭. ফলাফল ও প্রকাশ'], ['people', '৮. শিক্ষক ও শিক্ষার্থী']
];

/* =========================================================
   Helpers
   ========================================================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var BN_D = '০১২৩৪৫৬৭৮৯';
function en2(s) { return String(s == null ? '' : s).replace(/[০-৯]/g, function (d) { return BN_D.indexOf(d); }); }
function toNum(s) { var t = en2(s).trim(); if (t === '') return ''; var n = parseFloat(t); return isNaN(n) ? '' : n; }
function uid() { return 'e' + Math.random().toString(36).slice(2, 8); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function clsName(id) { var c = CLASSES.filter(function (x) { return x.id === +id; })[0]; return c ? c.n : id; }
function groupFor(c) { return c <= 8 ? 'junior' : (c <= 10 ? 'secondary' : 'higher'); }
function opt(v, t, sel) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }
function setPath(o, p, v) {
  var a = p.split('.');
  for (var i = 0; i < a.length - 1; i++) {
    var k = a[i];
    if (o[k] == null) o[k] = /^\d+$/.test(a[i + 1]) ? [] : {};
    o = o[k];
  }
  o[a[a.length - 1]] = v;
}
var toastT;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600); }
function download(name, text, type) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

/* =========================================================
   State + autosave
   ========================================================= */
function blank() {
  return {
    v: 1,
    school: { name: 'MH একাডেমি', center: 'MH একাডেমি', principal: 'অধ্যক্ষ', controller: 'পরীক্ষা নিয়ন্ত্রক', instructions: DEFAULT_INSTR },
    exams: [], notices: [], students: {}, routines: {}, rooms: {}, seatOpts: {}, seats: {}, subjects: {}, marks: {}
  };
}
function load() {
  try { var r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) {}
  return blank();
}
var S = load();
var UI = { tab: 'exams', exam: null, cls: 9 };
var saveT;
function save() {
  var el = $('#saved');
  el.textContent = 'সংরক্ষণ হচ্ছে…';
  clearTimeout(saveT);
  saveT = setTimeout(function () {
    try { localStorage.setItem(KEY, JSON.stringify(S)); el.textContent = '✓ সংরক্ষিত (এই ব্রাউজারে)'; }
    catch (e) { el.textContent = '⚠ সংরক্ষণ হয়নি — ব্যাকআপ নিন'; }
  }, 250);
}
function exam(id) { return S.exams.filter(function (e) { return e.id === id; })[0]; }
function curExam() { var e = exam(UI.exam); if (!e && S.exams.length) { UI.exam = S.exams[0].id; e = S.exams[0]; } return e; }
function students(c) { return (S.students[c] = S.students[c] || []); }
function ensure(obj, a, b) { obj[a] = obj[a] || {}; if (b !== undefined) obj[a][b] = obj[a][b] || []; return obj[a]; }

/* =========================================================
   Grading engine
   ========================================================= */
function scaleFor(pct) { for (var i = 0; i < SCALE.length; i++) if (pct >= SCALE[i].min) return SCALE[i]; return SCALE[SCALE.length - 1]; }
function overallGrade(gpa) { if (gpa >= 5) return 'A+'; if (gpa >= 4) return 'A'; if (gpa >= 3.5) return 'A-'; if (gpa >= 3) return 'B'; if (gpa >= 2) return 'C'; if (gpa >= 1) return 'D'; return 'F'; }
function partsOf(sub) { return (sub.parts && sub.parts.length) ? sub.parts : [{ n: 'মোট', f: +sub.full || 0 }]; }

/* one subject for one student. vals = array of strings per part */
function subjectResult(sub, vals) {
  var parts = partsOf(sub), total = 0, filled = 0, absent = false, bad = false, pm = [];
  parts.forEach(function (p, i) {
    var v = vals && vals[i] != null ? String(vals[i]).trim() : '';
    if (v === '') { pm.push(null); return; }
    filled++;
    if (/^(a|abs|অনু|অনুপস্থিত)$/i.test(v)) { absent = true; pm.push('A'); return; }
    var n = parseFloat(en2(v));
    if (isNaN(n) || n < 0 || n > p.f) { bad = true; pm.push(null); return; }
    total += n; pm.push(n);
  });
  var out = { n: sub.name, f: +sub.full || 0, pm: pm, total: total, complete: filled === parts.length && !bad, bad: bad, absent: absent };
  if (!out.complete) return out;
  var pass = sub.pass != null && sub.pass !== '' ? +sub.pass : Math.ceil(out.f * 0.33);
  if (absent || total < pass) { out.gr = 'F'; out.gp = 0; out.failed = true; }
  else { var s = scaleFor(out.f ? total / out.f * 100 : 0); out.gr = s.g === 'F' ? 'D' : s.g; out.gp = s.g === 'F' ? 1 : s.p; out.failed = false; }
  return out;
}

function compute(eid, cls) {
  var subs = ((S.subjects[eid] || {})[cls]) || [];
  var mk = ((S.marks[eid] || {})[cls]) || {};
  var rows = students(cls).slice().sort(function (a, b) { return a.roll - b.roll; }).map(function (st) {
    var vals = mk[st.roll] || [];
    var sr = subs.map(function (s, i) { return subjectResult(s, vals[i]); });
    var complete = subs.length > 0 && sr.every(function (x) { return x.complete; });
    var row = { roll: st.roll, name: st.name, father: st.father, group: st.group, photo: st.photo, subs: sr, complete: complete, bad: sr.some(function (x) { return x.bad; }) };
    row.total = sr.reduce(function (a, x) { return a + x.total; }, 0);
    if (complete) {
      var failed = sr.some(function (x) { return x.failed; });
      row.ok = !failed;
      row.gpa = failed ? 0 : Math.min(5, Math.round(sr.reduce(function (a, x) { return a + x.gp; }, 0) / sr.length * 100) / 100);
      row.gr = failed ? 'F' : overallGrade(row.gpa);
    }
    return row;
  });
  var ranked = rows.filter(function (r) { return r.complete && r.ok; }).sort(function (a, b) {
    return (b.gpa - a.gpa) || (b.total - a.total) || (a.roll - b.roll);
  });
  ranked.forEach(function (r, i) {
    var prev = ranked[i - 1];
    r.pos = (prev && prev.gpa === r.gpa && prev.total === r.total) ? prev.pos : i + 1;
  });
  return { subs: subs, rows: rows };
}

/* =========================================================
   Seat allocation
   ========================================================= */
function allocate(eid) {
  var e = exam(eid), opts = (S.seatOpts[eid] = S.seatOpts[eid] || {}), rooms = S.rooms[eid] || [];
  var cl = (opts.classes && opts.classes.length ? opts.classes : e.classes).slice();
  var lists = cl.map(function (c) { return students(c).slice().sort(function (a, b) { return a.roll - b.roll; }).map(function (s) { return { c: +c, roll: s.roll }; }); });
  var queue = [];
  if (opts.mode === 'mix') {
    var more = true, i = 0;
    while (more) { more = false; lists.forEach(function (l) { if (i < l.length) { queue.push(l[i]); more = true; } }); i++; }
  } else { lists.forEach(function (l) { queue = queue.concat(l); }); }
  var seats = [], qi = 0, left = 0;
  rooms.forEach(function (r) {
    var cap = +r.cap || 0;
    for (var s = 1; s <= cap && qi < queue.length; s++) { var q = queue[qi++]; seats.push({ c: q.c, roll: q.roll, room: r.name, seat: s }); }
  });
  left = queue.length - qi;
  S.seats[eid] = seats;
  return { placed: seats.length, left: left };
}

/* =========================================================
   Build public data.js
   ========================================================= */
function buildPublic(sample) {
  var out = {
    v: 1, updated: new Date().toISOString(), sample: !!sample,
    school: S.school, scale: SCALE.map(function (s) { return { min: s.min, g: s.g, p: s.p }; }),
    exams: [], notices: [], routines: {}, students: {}, seats: {}, results: {}
  };
  var needStudents = {};
  S.exams.forEach(function (e) {
    var any = e.pub.routine || e.pub.admit || e.pub.seat || e.pub.result;
    var hasNotice = S.notices.some(function (n) { return n.pub && n.exam === e.id; });
    if (!any && !hasNotice) return;
    out.exams.push({ id: e.id, name: e.name, type: e.type, year: e.year, classes: e.classes, pub: { routine: !!e.pub.routine, admit: !!e.pub.admit, seat: !!e.pub.seat, result: !!e.pub.result } });
    if (e.pub.routine || e.pub.admit) {
      var rt = {};
      Object.keys(S.routines[e.id] || {}).forEach(function (c) {
        var rows = S.routines[e.id][c].filter(function (r) { return r.date || r.subject; });
        if (rows.length) rt[c] = rows.map(function (r) { return { d: r.date, t: r.time, s: r.subject, c: r.code || '' }; });
      });
      out.routines[e.id] = rt;
    }
    if (e.pub.admit || e.pub.seat) e.classes.forEach(function (c) { needStudents[c] = true; });
    if (e.pub.seat) out.seats[e.id] = (S.seats[e.id] || []).map(function (s) { return { c: s.c, r: s.roll, rm: s.room, s: s.seat }; });
    if (e.pub.result) {
      var res = {};
      e.classes.forEach(function (c) {
        var cm = compute(e.id, c), list = [];
        cm.rows.forEach(function (r) {
          if (!r.complete) return;
          list.push({
            r: r.roll, n: r.name, f: r.father || '', g: r.group || '',
            subs: r.subs.map(function (s) {
              var o = { n: s.n, f: s.f, m: s.total, gr: s.gr, gp: s.gp };
              var sub = cm.subs[r.subs.indexOf(s)];
              if (sub.parts && sub.parts.length > 1) o.pt = sub.parts.map(function (p, i) { return [p.n, p.f, s.pm[i]]; });
              if (s.absent) o.ab = 1;
              return o;
            }),
            tot: r.total, gpa: r.gpa, gr: r.gr, ok: r.ok ? 1 : 0, pos: r.ok ? r.pos : 0
          });
        });
        if (list.length) res[c] = list;
      });
      out.results[e.id] = res;
    }
  });
  Object.keys(needStudents).forEach(function (c) {
    var l = students(c).filter(function (s) { return s.name; });
    if (l.length) out.students[c] = l.map(function (s) { return { r: s.roll, n: s.name, f: s.father || '', g: s.group || '', p: s.photo || '' }; });
  });
  out.notices = S.notices.filter(function (n) { return n.pub; })

      done.slice().sort(function (a, b) { return (a.ok ? a.pos : 9999) - (b.ok ? b.pos : 9999) || a.roll - b.roll; }).forEach(function (r) {

var VIEWS = { exams: vExams, students: vStudents, notices: vNotices, routine: vRoutine, seats: vSeats, marks: vMarks, publish: vPublish };
function render() {

}
$('#tabs').addEventListener('click', function (e) {

function onField(e) {
  var t = e.target, p = t.getAttribute('data-path');
  if (t.hasAttribute('data-ui')) { UI[t.getAttribute('data-ui')] = t.getAttribute('data-ui') === 'cls' ? +t.value : t.value; render(); return; }
  if (t.hasAttribute('data-m')) { markInput(t); return; }
  if (t.hasAttribute('data-parts')) { if (e.type === 'change') setParts(+t.getAttribute('data-parts'), t.value); return; }

  var v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.hasAttribute('data-num')) v = toNum(v);
  setPath(S, p, v); save();

}

view.addEventListener('change', onField);

function setParts(i, txt) {

  var had = (sub.parts && sub.parts.length) || 0;
  if (parts.length !== had && hasMarks(e.id, UI.cls, i) && !confirm('এই বিষয়ের অংশ বদলালে এর আগের নম্বর মুছে যাবে। চালিয়ে যাবেন?')) { render(); return; }
  if (parts.length !== had) clearSubjectMarks(e.id, UI.cls, i);

function ppRead() {
  var kind = $('#ppKind').value, e = UI.pp.edit || {}, st = kind === 'student', g = function (id) { var el = $('#' + id); return el ? el.value.trim() : ''; };
  var p = { id: e.id, kind: kind, name: g('ppName'), department: g('ppDept'), photo: UI.pp.photo || e.photo || '', order: e.order || (nextOrder(kind)) };
  if (st) { p.cls = +g('ppCls') || 0; p.roll = +g('ppRoll') || 0; p.profession = ''; p.designation = ''; }
  else { p.profession = g('ppProf'); p.designation = g('ppDesig'); }
  return p;
}
function nextOrder(kind) { return (UI.pp.rows || []).filter(function (r) { return r.kind === kind; }).reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0) + 1; }
function ppResize(file, cb) {
  var rd = new FileReader();
  rd.onload = function () {
    var im = new Image();
    im.onload = function () {
      var s = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 320;
      var sx = (im.width - s) / 2, sy = (im.height - s) * 0.2;
      c.getContext('2d').drawImage(im, sx, sy, s, s, 0, 0, 320, 320);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    im.onerror = function () { toast('ছবিটি পড়া যায়নি'); };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
view.addEventListener('change', function (e) {
  if (e.target.id === 'ppPhoto' && e.target.files[0]) {
    ppResize(e.target.files[0], function (d) { UI.pp.photo = d; var pv = $('#ppPrev'); pv.src = d; pv.style.visibility = 'visible'; });
  }
  if (e.target.id === 'ppFilterSel') { UI.pp.filter = e.target.value; render(); }
  if (e.target.id === 'ppKind') { UI.pp.edit = { kind: e.target.value, name: $('#ppName').value }; UI.pp.kind = e.target.value; render(); }
});
function ppDone(msg) { UI.pp.msg = ''; UI.pp.edit = null; UI.pp.photo = ''; toast(msg); ppReload(); }
function ppErr(e) { UI.pp.msg = (e && e.code === 'permission-denied') ? 'অনুমতি নেই — Firestore Rules-এ আপনার ইমেইল বসানো হয়েছে কি দেখুন।' : 'ব্যর্থ: ' + (e && (e.code || e.message) || e); render(); }

};

ACTS.ppEdit = function (el) {

};
ACTS.ppSave = function () {
  var p = ppRead(); if (!p.name) { toast('নাম লিখুন'); return; }

};
ACTS.ppDel = function (el) {
  var id = el.getAttribute('data-id'); if (!confirm('মুছে ফেলবেন?')) return;
  ppFB().remove(id).then(function () { ppDone('মুছে ফেলা হয়েছে'); }).catch(ppErr);
};
ACTS.ppImport = function () {
  var seed = window.MH_PEOPLE_SEED || []; if (!seed.length) { toast('people.js পাওয়া যায়নি'); return; }
  if (!confirm(seed.length + ' জনের প্রাথমিক তালিকা Firebase-এ তোলা হবে। চালিয়ে যাবেন?')) return;
  UI.pp.msg = 'তোলা হচ্ছে…'; render();
  fetchSeedPhotos(seed).then(function (rows) { return ppFB().importMany(rows); }).then(function () { ppDone('তালিকা তোলা হয়েছে'); }).catch(ppErr);
};
/* seed photos are files next to index.html — embed them (small JPEGs) so the admin and the site both show them */
function fetchSeedPhotos(seed) {
  return Promise.all(seed.map(function (p) {
    if (!p.photo || /^data:/.test(p.photo)) return p;
    return fetch(p.photo).then(function (r) { return r.blob(); }).then(function (b) {
      return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { var q = Object.assign({}, p); q.photo = fr.result; res(q); }; fr.readAsDataURL(b); });
    }).catch(function () { return p; });
  }));
}
